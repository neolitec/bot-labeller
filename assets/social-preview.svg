<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- Source for the repository's social preview (Settings → Social preview).
       Upload the rendered PNG, kept alongside as social-preview.png. -->
  <rect width="1280" height="640" fill="#f6f8fa"/>
  <!-- logo, same mark as logo.svg, scaled and placed left -->
  <g transform="translate(96 128) scale(0.75)">
    <g transform="rotate(-6 256 256)" fill="none" stroke="#1f6feb" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">
      <path d="M62 256 L182 164 H396 Q430 164 430 198 V314 Q430 348 396 348 H182 Z"/>
      <circle cx="152" cy="256" r="19"/>
      <path d="M306 164 V118"/>
      <circle cx="306" cy="100" r="15" fill="#fbca04" stroke="none"/>
      <rect x="236" y="216" width="44" height="44" rx="11" fill="#1f6feb" stroke="none"/>
      <rect x="318" y="216" width="44" height="44" rx="11" fill="#fbca04" stroke="none"/>
      <path d="M250 302 H366" stroke-width="16"/>
    </g>
  </g>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="510" y="278" font-size="86" font-weight="700" fill="#1f2328">bot-labeller</text>
    <text x="514" y="352" font-size="34" fill="#57606a">Know which pull requests were machine-written —</text>
    <text x="514" y="400" font-size="34" fill="#57606a">before you spend human time on them.</text>
  </g>
  <!-- the three labels, as pills -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="26" font-weight="600">
    <rect x="514" y="452" rx="17" width="216" height="46" fill="#1f6feb"/>
    <text x="622" y="483" fill="#ffffff" text-anchor="middle">bot:authored</text>
    <rect x="754" y="452" rx="17" width="200" height="46" fill="#fbca04"/>
    <text x="854" y="483" fill="#1f2328" text-anchor="middle">bot:unclear</text>
    <rect x="978" y="452" rx="17" width="216" height="46" fill="#d73a4a"/>
    <text x="1086" y="483" fill="#ffffff" text-anchor="middle">bot:drive-by</text>
  </g>
</svg>
